name: Cyph3rfall
options:
  bundleIdPrefix: com.cyph3rfall
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

schemes:
  Cyph3rfall:
    build:
      targets:
        Cyph3rfall: all
    archive:
      config: Release

fileGroups:
  - Shared

targets:

  # ── Menu bar app ────────────────────────────────────────────────────────────
  Cyph3rfall:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
        type: group
      - path: TestApp
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyph3rfall.Cyph3rfall
        PRODUCT_NAME: Cyph3rfall
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: TestApp/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        GCC_OPTIMIZATION_LEVEL: s
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: GHXKLLWQPM
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Gregory Stock (GHXKLLWQPM)"
          DEVELOPMENT_TEAM: GHXKLLWQPM
    dependencies:
      - sdk: Cocoa.framework
      - sdk: ServiceManagement.framework
      - sdk: LocalAuthentication.framework
      - sdk: Carbon.framework
